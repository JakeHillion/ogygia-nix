name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          max-jobs = 2
          sandbox = true

    - name: Setup Nix S3 cache
      uses: testquorum/nix-s3-generations@505cc3553746818b68be0f79bc2951f0f379d5cf # v0.1.6
      with:
        s3-endpoint: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
        bucket: jakehillion-nix
        public-key: nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
        private-key: ${{ secrets.NIX_SIGNING_KEY }}
        region: auto
        aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    - name: Enter CI devShell
      uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
      with:
        arguments: .#ci

    - name: Build all outputs
      run: nix-fast-build --no-nom --flake ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem)" -j 2 --eval-workers 4

    - name: Run tests from the Nix-built nextest archive
      run: |
        archive="$(nix build --no-link --print-out-paths .#ogygia-nextest-archive)/archive.tar"
        archive_zst="$RUNNER_TEMP/ogygia-nextest-archive.tar.zst"
        zstd -T0 "$archive" -o "$archive_zst"
        cargo nextest run \
          --archive-file "$archive_zst" \
          --workspace-remap "$GITHUB_WORKSPACE" \
          --test-threads num-cpus \
          --no-fail-fast

  macos-app:
    runs-on: xcode-27

    env:
      APP: ogygia-macos/Applications/Ogygia.app

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    # No S3 cache step here: this job adds Xcode to the store, and Xcode's
    # licence forbids pushing it to the public cache.
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          sandbox = true
          # The host paths app/xcode-build declares in __impureHostDeps.
          allowed-impure-host-deps = /System/Library /bin/sh /dev /usr/lib /usr/share/firmlinks /Library/Developer/PrivateFrameworks /Library/Apple/System/Library/PrivateFrameworks /Library/Preferences/com.apple.dt.Xcode.plist /usr/bin/codesign /usr/bin/touch

    # Xcode cannot be downloaded without an Apple ID, so the runner's copy
    # is added under the hash nixpkgs pins. A runner image whose Xcode
    # differs from the pin fails here rather than building with it.
    - name: Add Xcode to the Nix store
      run: |
        expected="$(nix eval --raw .#packages.aarch64-darwin.ogygia-macos.xcode.outPath)"
        cp -cR /Applications/Xcode_27.app "$RUNNER_TEMP/Xcode.app"
        added="$(nix-store --add-fixed --recursive sha256 "$RUNNER_TEMP/Xcode.app")"
        rm -rf "$RUNNER_TEMP/Xcode.app"
        if [ "$added" != "$expected" ]; then
          echo "::error::Runner Xcode is $added, but the pin expects $expected"
          exit 1
        fi

    - name: Build
      run: nix build -L --out-link ogygia-macos .#packages.aarch64-darwin.ogygia-macos

    # The build number is the flake's commit count, which falls back to 0
    # when history is missing; Sparkle would then never offer an update.
    - name: Check the build number
      run: test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$(git rev-list --count HEAD)"

    # ditto keeps the framework symlinks and code signatures, which the
    # artifact upload would otherwise flatten.
    - name: Archive the app for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Ogygia.app.zip"

    - name: Upload the app for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ogygia-macos
        path: ${{ runner.temp }}/Ogygia.app.zip
        compression-level: 0
        retention-days: 1

  macos-app-release:
    needs: macos-app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27

    # Releases run one at a time; a newer queued release replaces an older
    # pending one. Builds finish in any order, so the first step also skips
    # a release older than what the feed already offers.
    concurrency:
      group: macos-app-release
      cancel-in-progress: false

    env:
      ASSETS_BUCKET: ogygia-assets
      ASSETS_URL: https://assets.ogygia.dev
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
      # R2 does not accept every checksum newer AWS clients send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          sandbox = true

    - name: Download the app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ogygia-macos
        path: ${{ runner.temp }}

    - name: Unpack the app
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        ditto -x -k "$RUNNER_TEMP/Ogygia.app.zip" "$RUNNER_TEMP/release"
        rm "$RUNNER_TEMP/Ogygia.app.zip"
        chmod -R u+w "$RUNNER_TEMP/release/Ogygia.app"

    # Read from the bucket rather than the CDN, whose copy may be stale.
    # Only one release runs at a time, so nothing can publish between this
    # check and the upload.
    - name: Check the feed is older than this build
      id: feed
      run: |
        build="$(plutil -extract CFBundleVersion raw "$RUNNER_TEMP/release/Ogygia.app/Contents/Info.plist")"
        aws() { nix run --inputs-from . nixpkgs#awscli2 -- "$@"; }
        if aws s3 cp "s3://$ASSETS_BUCKET/macos/appcast.xml" "$RUNNER_TEMP/published.xml"; then
          published="$(sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p' "$RUNNER_TEMP/published.xml")"
        else
          published=0
        fi
        if [ "${published:-0}" -ge "$build" ]; then
          echo "::notice::The feed already offers build $published; skipping build $build"
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

    # Everything below runs outside the Nix sandbox: it needs the signing
    # identity, Apple's notary service and the asset bucket, none of which
    # belong in a derivation. It only signs and publishes what Nix built.
    - name: Import the Developer ID certificate
      if: steps.feed.outputs.release == 'true'
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(openssl rand -hex 32)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        # Keep the existing search list; its entries are space-free paths.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

    - name: Sign
      if: steps.feed.outputs.release == 'true'
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"

        if [ -z "$(plutil -extract SUPublicEDKey raw "$app/Contents/Info.plist")" ]; then
          echo "::error::SPARKLE_PUBLIC_ED_KEY is empty, so this build could never verify an update"
          exit 1
        fi

        # Inside out, as Sparkle documents for apps outside the App Sandbox.
        sign() { codesign --force --sign "Developer ID Application" --options runtime --timestamp "$@"; }
        sparkle="$app/Contents/Frameworks/Sparkle.framework"
        sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
        sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
        sign "$sparkle/Versions/B/Autoupdate"
        sign "$sparkle/Versions/B/Updater.app"
        sign "$sparkle"
        # The Nebula daemon and the Nebula it runs, which launchd starts from
        # the bundle as root.
        for helper in ogygia-macos-nebulad nebula nebula-cert; do
          sign "$app/Contents/MacOS/$helper"
        done
        sign --entitlements app/macos/Ogygia/Ogygia.entitlements "$app"
        codesign --verify --deep --strict --verbose=2 "$app"

    - name: Notarise
      if: steps.feed.outputs.release == 'true'
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        key="$RUNNER_TEMP/AuthKey.p8"
        echo "$ASC_KEY_P8" > "$key"
        ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarise.zip"
        xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
          --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
        rm "$key" "$RUNNER_TEMP/notarise.zip"
        xcrun stapler staple "$app"
        spctl --assess --type execute --verbose=2 "$app"

    # The image holds the stapled app beside a link to /Applications, so
    # installing is a drag from one to the other. It is notarised in its
    # own right, so Gatekeeper accepts it when opened, while the app
    # inside keeps its own ticket for when it runs from Applications.
    - name: Make the disk image
      if: steps.feed.outputs.release == 'true'
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        plist="$app/Contents/Info.plist"
        version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
        build="$(plutil -extract CFBundleVersion raw "$plist")"
        dmg="$RUNNER_TEMP/release/Ogygia-$version-$build.dmg"

        stage="$RUNNER_TEMP/dmg"
        mkdir "$stage"
        ditto "$app" "$stage/Ogygia.app"
        ln -s /Applications "$stage/Applications"
        # APFS with lzfse, which Sparkle recommends for updating from images.
        diskutil image create from --format ULFO --volumeName Ogygia "$stage" "$dmg"
        rm -rf "$stage"

        codesign --sign "Developer ID Application" --timestamp "$dmg"
        key="$RUNNER_TEMP/AuthKey.p8"
        echo "$ASC_KEY_P8" > "$key"
        xcrun notarytool submit "$dmg" \
          --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
        rm "$key"
        xcrun stapler staple "$dmg"
        spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

    - name: Publish
      if: steps.feed.outputs.release == 'true'
      env:
        SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        plist="$app/Contents/Info.plist"
        version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
        build="$(plutil -extract CFBundleVersion raw "$plist")"
        minimum="$(plutil -extract LSMinimumSystemVersion raw "$plist")"
        archive="Ogygia-$version-$build.dmg"
        # Releases are stored by content, so a name never changes what it
        # holds and can be cached forever. A rebuild of the same commit
        # signs and notarises afresh, so reusing a versioned name would let
        # caches serve bytes that no longer match the feed's signature.
        object="macos/$(shasum -a 256 "$RUNNER_TEMP/release/$archive" | cut -d' ' -f1).dmg"

        tools="$(nix build --no-link --print-out-paths .#packages.aarch64-darwin.ogygia-macos.sparkleTools)"
        signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - -p "$RUNNER_TEMP/release/$archive")"
        length="$(stat -f %z "$RUNNER_TEMP/release/$archive")"

        # One channel, so the feed only ever lists the newest build; Sparkle
        # never offers an update older than what is installed.
        cat > "$RUNNER_TEMP/appcast.xml" <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel>
            <title>Ogygia</title>
            <item>
              <title>Ogygia $version ($build)</title>
              <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
              <sparkle:version>$build</sparkle:version>
              <sparkle:shortVersionString>$version</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>$minimum</sparkle:minimumSystemVersion>
              <enclosure url="$ASSETS_URL/$object" length="$length" type="application/x-apple-diskimage" sparkle:edSignature="$signature"/>
            </item>
          </channel>
        </rss>
        XML
        # The feed is signed too, so the bucket is trusted for neither.
        echo "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - "$RUNNER_TEMP/appcast.xml"

        aws() { nix run --inputs-from . nixpkgs#awscli2 -- "$@"; }
        # The image must exist before the feed points at it.
        aws s3 cp "$RUNNER_TEMP/release/$archive" "s3://$ASSETS_BUCKET/$object" \
          --content-type application/x-apple-diskimage --cache-control "public, max-age=31536000, immutable"
        # A fixed name to link downloads to; it always holds the newest build.
        aws s3 cp "$RUNNER_TEMP/release/$archive" "s3://$ASSETS_BUCKET/macos/Ogygia.dmg" \
          --content-type application/x-apple-diskimage --cache-control "public, max-age=300"
        aws s3 cp "$RUNNER_TEMP/appcast.xml" "s3://$ASSETS_BUCKET/macos/appcast.xml" \
          --content-type application/xml --cache-control "public, max-age=300"

  single-commit:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 2

    # The queue rebase-merges, landing every commit of a PR. Each entry must
    # add exactly one commit on top of the entry ahead of it.
    - name: Require one commit per queued change
      run: |
        if [ "$(git log -1 --format=%P HEAD)" != "${{ github.event.merge_group.base_sha }}" ]; then
          echo "::error::A queued change must be exactly one commit"
          exit 1
        fi

  all-checks:
    needs: [nix, macos-app, single-commit]
    if: always()
    runs-on: ubuntu-24.04

    steps:
    - name: Require every check job to pass
      run: |
        test "${{ needs.nix.result }}" = success
        test "${{ needs.macos-app.result }}" = success
        if [ "${{ github.event_name }}" = merge_group ]; then
          test "${{ needs.single-commit.result }}" = success
        fi
