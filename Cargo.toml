[workspace]
members = [
    "src/ogygia",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "MIT"

[workspace.metadata.crane]
name = "ogygia-workspace"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
zookeeper = "0.8"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
